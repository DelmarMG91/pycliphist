[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycliphist"
version = "0.2.0"
description = "Cross-platform clipboard history manager: a SQLite-backed command-line tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DelmarMG91" }]
keywords = ["clipboard", "history", "cli", "sqlite", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/DelmarMG91/pycliphist"
Issues = "https://github.com/DelmarMG91/pycliphist/issues"
Changelog = "https://github.com/DelmarMG91/pycliphist/blob/main/CHANGELOG.md"

[project.scripts]
pycliphist = "pycliphist.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
